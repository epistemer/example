# confab: Confab, a conference organiser's back office.
# Generated by cfgx from the schema; don't edit. Every setting is commented
# out at its default: uncomment a line to change it.

# Logging
log:
  # Minimum log level; one of debug, info, warn, error.
  # Env CONFAB_LOG_LEVEL, flag --log-level. Used by every command.
  # level: "info"

  # Output format; one of text, json.
  # Env CONFAB_LOG_FORMAT, flag --log-format. Used by every command.
  # format: "text"

# HTTP server
server:
  # Address to listen on.
  # Env CONFAB_SERVER_ADDR, flag --server-addr. Used by Serve.
  # addr: "localhost:8080"

  # Address people reach the app at.
  # Env CONFAB_SERVER_PUBLIC_URL, flag --server-public-url. Used by Serve.
  # public_url: "http://localhost:8080"

  # How long to wait for requests to finish when stopping.
  # Env CONFAB_SERVER_SHUTDOWN_TIMEOUT, flag --server-shutdown-timeout. Used by Serve.
  # shutdown_timeout: "10s"

# Storage
storage:
  # Store file: settings, translations and sign-ins.
  # Env CONFAB_STORAGE_BOLT, flag --storage-bolt. Used by Serve, Seed.
  # bolt: "confab.db"

  # Directory of uploaded files.
  # Env CONFAB_STORAGE_FILES, flag --storage-files. Used by Serve, Seed.
  # files: "files"

# Database
db:
  # PostgreSQL connection URL.
  # Required. Secret: set it in the environment, not here.
  # Env CONFAB_DB_URL or CONFAB_DB_URL_FILE. Used by Serve, Migrate, Seed.
  # url:

# Outgoing mail
mail:
  # Directory each message is written to, one file per message.
  # Env CONFAB_MAIL_OUTBOX, flag --mail-outbox. Used by Serve, Seed.
  # outbox: "outbox"

# Sign-in and sessions
auth:
  # Issuer: the name in tokens and authenticator apps.
  # Required.
  # Env CONFAB_AUTH_ISSUER, flag --auth-issuer. Used by Serve, Seed.
  # issuer:

  # Master secret, at least 32 bytes; every key is derived from it.
  # Required. Secret: set it in the environment, not here.
  # Env CONFAB_AUTH_SECRET or CONFAB_AUTH_SECRET_FILE. Used by Serve, Seed.
  # secret:

  # Previous master secret, while rotating.
  # Secret: set it in the environment, not here.
  # Env CONFAB_AUTH_SECRET_PREVIOUS or CONFAB_AUTH_SECRET_PREVIOUS_FILE. Used by Serve, Seed.
  # secret_previous:

  # Origins whose cross-origin requests are trusted.
  # Env CONFAB_AUTH_TRUSTED_ORIGINS, flag --auth-trusted-origins. Used by Serve, Seed.
  # trusted_origins:

  # Sessions
  session:
    # Idle lifetime of a session.
    # Env CONFAB_AUTH_SESSION_IDLE, flag --auth-session-idle. Used by Serve, Seed.
    # idle: "24h0m0s"

    # Idle lifetime of a remembered session.
    # Env CONFAB_AUTH_SESSION_REMEMBERED_IDLE, flag --auth-session-remembered-idle. Used by Serve, Seed.
    # remembered_idle: "720h0m0s"

    # Longest lifetime of a session, whatever its use.
    # Env CONFAB_AUTH_SESSION_LIFETIME, flag --auth-session-lifetime. Used by Serve, Seed.
    # lifetime: "2160h0m0s"

  # Access tokens
  access:
    # Lifetime of an access token.
    # Env CONFAB_AUTH_ACCESS_LIFETIME, flag --auth-access-lifetime. Used by Serve, Seed.
    # lifetime: "10m0s"

  # Refresh tokens
  refresh:
    # How long a replaced refresh token still returns its successor.
    # Env CONFAB_AUTH_REFRESH_GRACE, flag --auth-refresh-grace. Used by Serve, Seed.
    # grace: "10s"

  # Sign-in flows
  flow:
    # Lifetime of a sign-in flow.
    # Env CONFAB_AUTH_FLOW_LIFETIME, flag --auth-flow-lifetime. Used by Serve, Seed.
    # lifetime: "15m0s"

  # Fresh proofs
  fresh:
    # How recent a proof must be to change a factor.
    # Env CONFAB_AUTH_FRESH_WINDOW, flag --auth-fresh-window. Used by Serve, Seed.
    # window: "10m0s"

  # Codes sent by email or SMS
  code:
    # Digits in a code.
    # Env CONFAB_AUTH_CODE_LENGTH, flag --auth-code-length. Used by Serve, Seed.
    # length: 6

    # Lifetime of a code.
    # Env CONFAB_AUTH_CODE_LIFETIME, flag --auth-code-lifetime. Used by Serve, Seed.
    # lifetime: "5m0s"

    # Wrong tries a code allows.
    # Env CONFAB_AUTH_CODE_TRIES, flag --auth-code-tries. Used by Serve, Seed.
    # tries: 5

    # Wait before another code may be sent.
    # Env CONFAB_AUTH_CODE_RESEND, flag --auth-code-resend. Used by Serve, Seed.
    # resend: "1m0s"

    # Codes a user may be sent in an hour.
    # Env CONFAB_AUTH_CODE_HOURLY, flag --auth-code-hourly. Used by Serve, Seed.
    # hourly: 5

  # Links sent by email
  link:
    # Lifetime of a recovery link.
    # Env CONFAB_AUTH_LINK_LIFETIME, flag --auth-link-lifetime. Used by Serve, Seed.
    # lifetime: "30m0s"

  # Invitations
  invitation:
    # Lifetime of an invitation.
    # Env CONFAB_AUTH_INVITATION_LIFETIME, flag --auth-invitation-lifetime. Used by Serve, Seed.
    # lifetime: "72h0m0s"

  # Registered devices
  device:
    # Lifetime of a registered device.
    # Env CONFAB_AUTH_DEVICE_LIFETIME, flag --auth-device-lifetime. Used by Serve, Seed.
    # lifetime: "2160h0m0s"

  # Passwords
  password:
    # Fewest characters in a password.
    # Env CONFAB_AUTH_PASSWORD_MIN_LENGTH, flag --auth-password-min-length. Used by Serve, Seed.
    # min_length: 12

    # Least strength a new password needs, 3 or 4.
    # Env CONFAB_AUTH_PASSWORD_MIN_SCORE, flag --auth-password-min-score. Used by Serve, Seed.
    # min_score: 4

    # Memory for each password hash, in MiB.
    # Env CONFAB_AUTH_PASSWORD_MEMORY, flag --auth-password-memory. Used by Serve, Seed.
    # memory: 64

    # Passes of each password hash.
    # Env CONFAB_AUTH_PASSWORD_TIME, flag --auth-password-time. Used by Serve, Seed.
    # time: 2

    # Password hashes at once.
    # Default: from runtime.NumCPU.
    # Env CONFAB_AUTH_PASSWORD_CONCURRENCY, flag --auth-password-concurrency. Used by Serve, Seed.
    # concurrency:

  # Throttling of wrong proofs
  throttle:
    # Failures before waits start.
    # Env CONFAB_AUTH_THROTTLE_FREE, flag --auth-throttle-free. Used by Serve, Seed.
    # free: 5

    # Longest wait.
    # Env CONFAB_AUTH_THROTTLE_CEILING, flag --auth-throttle-ceiling. Used by Serve, Seed.
    # ceiling: "15m0s"

    # Time without a failure after which a counter starts again.
    # Env CONFAB_AUTH_THROTTLE_WINDOW, flag --auth-throttle-window. Used by Serve, Seed.
    # window: "1h0m0s"

  # Cookies
  cookie:
    # Drop Secure and the __Host- prefix, for development over plain HTTP.
    # Env CONFAB_AUTH_COOKIE_INSECURE, flag --auth-cookie-insecure. Used by Serve, Seed.
    # insecure:

  # Passkeys
  passkey:
    # Domain passkeys are bound to: the site's, without scheme or port.
    # Required.
    # Env CONFAB_AUTH_PASSKEY_DOMAIN, flag --auth-passkey-domain. Used by Serve, Seed.
    # domain:

    # Origins passkeys may be used from; https://<domain> when empty.
    # Env CONFAB_AUTH_PASSKEY_ORIGINS, flag --auth-passkey-origins. Used by Serve, Seed.
    # origins:

# Theme
theme:
  # Brand colour.
  # Env CONFAB_THEME_BRAND_COLOR, flag --theme-brand-color. Used by Serve.
  # brand_color: "#2f5bd3"

  # Danger colour.
  # Env CONFAB_THEME_DANGER_COLOR, flag --theme-danger-color. Used by Serve.
  # danger_color: "#c62828"

  # Warning colour.
  # Env CONFAB_THEME_WARNING_COLOR, flag --theme-warning-color. Used by Serve.
  # warning_color: "#f2b01e"

  # Success colour.
  # Env CONFAB_THEME_SUCCESS_COLOR, flag --theme-success-color. Used by Serve.
  # success_color: "#1e8a4c"

  # Information colour.
  # Env CONFAB_THEME_INFO_COLOR, flag --theme-info-color. Used by Serve.
  # info_color: "#0f7c9e"

  # Text font.
  # Env CONFAB_THEME_FONT_SANS, flag --theme-font-sans. Used by Serve.
  # font_sans: "system-ui, \"Segoe UI\", \"Roboto\", \"Noto Sans\", \"Noto Sans Arabic\", sans-serif"

  # Code font.
  # Env CONFAB_THEME_FONT_MONO, flag --theme-font-mono. Used by Serve.
  # font_mono: "ui-monospace, \"SFMono-Regular\", \"Menlo\", \"Consolas\", monospace"

  # Corner radius.
  # Env CONFAB_THEME_RADIUS, flag --theme-radius. Used by Serve.
  # radius: "0.5rem"

# Translations
i18n:
  # Locale for visitors without a chosen locale; empty means the source locale.
  # Env CONFAB_I18N_DEFAULT_LOCALE, flag --i18n-default-locale. Used by Serve.
  # default_locale:

# Call for papers
cfp:
  # Refuse new talks.
  # Env CONFAB_CFP_CLOSED, flag --cfp-closed. Used by Serve.
  # closed:

  # Talks a speaker may give at one event.
  # Env CONFAB_CFP_MAX_TALKS, flag --cfp-max-talks. Used by Serve.
  # max_talks: 3

  # Level a new talk starts at; one of beginner, intermediate, advanced.
  # Env CONFAB_CFP_DEFAULT_LEVEL, flag --cfp-default-level. Used by Serve.
  # default_level: "beginner"

  # Length a new talk starts at.
  # Env CONFAB_CFP_DEFAULT_DURATION, flag --cfp-default-duration. Used by Serve.
  # default_duration: "30m0s"

# Demo data
demo:
  # Organiser's email address.
  # Env CONFAB_DEMO_EMAIL, flag --demo-email. Used by Seed.
  # email: "ada@confab.example"

  # Organiser's name.
  # Env CONFAB_DEMO_NAME, flag --demo-name. Used by Seed.
  # name: "Ada Organiser"

  # Organiser's password.
  # Required. Secret: set it in the environment, not here.
  # Env CONFAB_DEMO_PASSWORD or CONFAB_DEMO_PASSWORD_FILE. Used by Seed.
  # password:
