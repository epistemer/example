version: "2"
sql:
  - engine: "postgresql"
    schema: "db/schema.sql"
    queries: "db/query.sql"
    gen:
      go:
        package: "models"
        out: "internal/models"
        sql_package: "pgx/v5"
        emit_all_enum_values: true
        emit_interface: true
        emit_pointers_for_null_types: true
        overrides:
          - column: "event_view.from_price"   # min() over tiers: NULL without any, which sqlc can't infer
            go_type: {import: "github.com/shopspring/decimal", type: "Decimal", pointer: true}
          - db_type: "pg_catalog.numeric"
            go_type: {import: "github.com/shopspring/decimal", type: "Decimal"}
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type: {import: "github.com/shopspring/decimal", type: "Decimal", pointer: true}
          - db_type: "date"
            go_type: {import: "time", type: "Time"}
          - db_type: "date"
            nullable: true
            go_type: {import: "time", type: "Time", pointer: true}
          - db_type: "timestamptz"
            go_type: {import: "time", type: "Time"}
          - db_type: "timestamptz"
            nullable: true
            go_type: {import: "time", type: "Time", pointer: true}
      json:
        out: "internal/models"
        filename: "codegen_request.json"
