openapi: 3.0.3
info:
  title: Confab API
  version: 1.0.0
  description: >
    The programme for apps and partners. Sign in for a bearer token; the
    public schedule needs none.
servers:
  - url: /api/v1
security:
  - bearer: []
paths:
  /sign-in:
    post:
      operationId: signIn
      summary: Sign in
      description: A password first; when a code was emailed, call again with the flow and the code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login: {type: string, format: email}
                password: {type: string, minLength: 1}
                flow: {type: string, minLength: 1}
                code: {type: string, pattern: '^[0-9]{6}$'}
      responses:
        "200":
          description: Tokens, or the next step
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SignInResult"}
        default: {$ref: "#/components/responses/Error"}
  /refresh:
    post:
      operationId: refresh
      summary: Refresh tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh]
              properties:
                refresh: {type: string, minLength: 1}
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SignInResult"}
        default: {$ref: "#/components/responses/Error"}
  /me:
    get:
      operationId: getMe
      summary: Who is signed in
      x-auth: session
      responses:
        "200":
          description: The session's user
          content:
            application/json:
              schema:
                type: object
                required: [user, verified]
                properties:
                  user: {type: string}
                  verified: {type: boolean}
        default: {$ref: "#/components/responses/Error"}
  /events/{slug}/schedule:
    get:
      operationId: getSchedule
      summary: Public schedule
      x-label: An event's public schedule
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'}
      responses:
        "200":
          description: The scheduled talks, in order
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ScheduledTalk"}
        default: {$ref: "#/components/responses/Error"}
  /talks:
    get:
      operationId: listTalks
      summary: List talks
      x-permission: api.talks.read
      parameters:
        - name: state
          in: query
          schema: {$ref: "#/components/schemas/TalkState"}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        "200":
          description: A page of talks
          content:
            application/json:
              schema:
                type: object
                required: [talks, total]
                properties:
                  total: {type: integer, format: int64}
                  talks:
                    type: array
                    items: {$ref: "#/components/schemas/Talk"}
        default: {$ref: "#/components/responses/Error"}
  /talks/{id}/state:
    patch:
      operationId: setTalkState
      summary: Change a talk's state
      x-route-key: api.talks.review
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: {$ref: "#/components/schemas/TalkState"}
      responses:
        "204": {description: Changed}
        default: {$ref: "#/components/responses/Error"}
  /talks/{id}/slides:
    post:
      operationId: uploadSlides
      summary: Add slides to a talk
      x-permission: api.talks.read
      x-max-body: 25MiB
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [key]
                properties:
                  key: {type: string}
        default: {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  responses:
    Error:
      description: An error people can read
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
    SignInResult:
      type: object
      properties:
        next: {type: string, enum: [code]}
        flow: {type: string}
        access: {type: string}
        refresh: {type: string}
        verified: {type: boolean}
    TalkState:
      type: string
      enum: [submitted, accepted, rejected, scheduled]
      x-go-type: models.TalkState
      x-go-type-import:
        path: github.com/epistemer/example/internal/models
    Talk:
      type: object
      required: [id, title, state, speaker, event]
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        state: {$ref: "#/components/schemas/TalkState"}
        speaker: {type: string}
        event: {type: string}
        starts_at: {type: string, format: date-time}
    ScheduledTalk:
      type: object
      required: [id, title, starts_at, minutes, speaker, level, format]
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        starts_at: {type: string, format: date-time}
        minutes: {type: integer}
        speaker: {type: string}
        level: {type: string}
        format: {type: string}
